name: Update Bun Version Examples

on:
  schedule:
    - cron: '0 0 * * 0' # Run weekly at midnight on Sunday
  workflow_dispatch: # Allow manual triggering from the GitHub Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  update-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch latest Bun version
        id: get-version
        run: |
          # Fetch the latest release from the GitHub API
          LATEST_TAG=$(curl -sL https://api.github.com/repos/oven-sh/bun/releases/latest | jq -r .tag_name)
          
          # Robustly extract just the semantic version number (e.g., 1.3.13) regardless of prefix
          LATEST_VERSION=$(echo "$LATEST_TAG" | grep -oE "[0-9]+\.[0-9]+\.[0-9]+" | head -n 1)
          
          echo "latest_version=$LATEST_VERSION" >> $GITHUB_OUTPUT
          echo "Found latest Bun version: $LATEST_VERSION"

      - name: Update version references in code
        id: update-files
        run: |
          LATEST_VERSION=${{ steps.get-version.outputs.latest_version }}
          
          # Find the current version used in the README examples (e.g., BUN_VERSION=1.3.13)
          CURRENT_VERSION=$(grep -oP "BUN_VERSION=\K[0-9]+\.[0-9]+\.[0-9]+" README.md | head -n 1)
          
          if [ -z "$CURRENT_VERSION" ]; then
            echo "Error: Could not extract the current version from README.md"
            exit 1
          fi
          
          if [ "$CURRENT_VERSION" == "$LATEST_VERSION" ]; then
            echo "Version is already up to date ($LATEST_VERSION). No changes needed."
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "Updating examples from $CURRENT_VERSION to $LATEST_VERSION..."
          
          # Replace the exact current version with the latest version across the files
          sed -i "s/$CURRENT_VERSION/$LATEST_VERSION/g" README.md
          sed -i "s/v$CURRENT_VERSION/v$LATEST_VERSION/g" bin/test
          
          echo "changed=true" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.update-files.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "docs: update Bun examples to v${{ steps.get-version.outputs.latest_version }}"
          title: "Update Bun examples to v${{ steps.get-version.outputs.latest_version }}"
          body: |
            This PR automatically updates the Bun version examples in `README.md` and the smoke tests to the latest stable release: **v${{ steps.get-version.outputs.latest_version }}**.
            
            _Triggered by GitHub Actions._
          branch: "update-bun-version"
          delete-branch: true
          labels: "automated pr, documentation"
