name: Release

on:
  push:
    tags: ['v*']

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, attest, publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build buildpack tarball
        run: |
          mkdir dist
          git archive --format=tar.gz --prefix=heroku-buildpack-bun/ \
            -o "dist/heroku-buildpack-bun-${GITHUB_REF_NAME}.tar.gz" HEAD
          tar -tzf "dist/heroku-buildpack-bun-${GITHUB_REF_NAME}.tar.gz" > /dev/null
          echo "asset=dist/heroku-buildpack-bun-${GITHUB_REF_NAME}.tar.gz" >> "$GITHUB_ENV"

      - name: Generate SLSA build provenance attestation
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/heroku-buildpack-bun-*.tar.gz

      - name: Prepare attestation release asset
        run: cp "${{ steps.attest.outputs.bundle-path }}" \
          "dist/heroku-buildpack-bun-${GITHUB_REF_NAME}.intoto.jsonl"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "heroku-buildpack-bun ${GITHUB_REF_NAME}" \
            --generate-notes --verify-tag \
            dist/*.tar.gz dist/*.intoto.jsonl
