name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '29 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    name: Filesystem vuln scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run Trivy FS scan (fail on findings, publish SARIF)
        uses: aquasecurity/trivy-action@f9424c10c36e288d5fa79bd3dfd1aeb2d6eae808 # 0.33.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@ea14db8afdef5d462e69d78c4ca45002d4522418 # v4.37.4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

  shell-audit:
    name: Buildpack security audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: No curl-pipe-shell, no eval, no hardcoded secrets
        run: |
          fail=0
          if grep -RInE 'curl[^|]*\|[[:space:]]*(ba)?sh|eval[[:space:]]' bin lib; then
            echo "::error::curl-pipe-shell or eval found"; fail=1
          fi
          if grep -RIniE 'api[_-]?key[[:space:]]*[:=][[:space:]]*["'\''][A-Za-z0-9]{8,}|password[[:space:]]*[:=]|BEGIN [A-Z ]*PRIVATE KEY' bin lib; then
            echo "::error::possible hardcoded secret"; fail=1
          fi
          exit $fail

      - name: ENV_DIR blocklist present
        run: grep -q 'LD_AUDIT' bin/compile && grep -q 'LD_CONFIG' bin/compile

