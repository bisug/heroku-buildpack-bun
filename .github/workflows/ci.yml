name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ShellCheck + shfmt + syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca # master
        with:
          severity: warning
          check_together: 'yes'

      - name: Check shell formatting
        run: |
          SHFMT_VERSION=v3.9.0
          curl -fsSL -o /tmp/shfmt "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION#v}_linux_amd64"
          chmod +x /tmp/shfmt
          /tmp/shfmt -d -i 2 -ci -bn bin/compile bin/detect bin/release bin/test lib/json.sh lib/version.sh

      - name: Bash syntax check
        run: |
          for f in bin/compile bin/detect bin/release bin/test lib/json.sh lib/version.sh; do
            bash -n "$f"
          done

      - name: Validate workflow YAML
        run: python3 -c "import glob,sys,yaml; [yaml.safe_load(open(f)) for f in glob.glob('.github/workflows/*.yml')]; print('YAML OK')"

  detect-release:
    name: detect + release smoke
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends curl jq unzip

      - name: detect accepts Bun app, rejects plain Node app
        run: |
          t=$(mktemp -d)
          echo '{"engines":{"bun":"1.2.0"}}' > "$t/package.json"
          ./bin/detect "$t" | grep -q Bun
          n=$(mktemp -d)
          echo '{"engines":{"node":">=18"}}' > "$n/package.json"
          if ./bin/detect "$n"; then echo "detect must reject node-only app"; exit 1; fi
          rm -rf "$t" "$n"

      - name: release emits process types
        run: |
          t=$(mktemp -d)
          echo '{"scripts":{"start":"bun index.js","worker":"bun w.js"}}' > "$t/package.json"
          ./bin/release "$t" | grep -q "web: bun run start"
          ./bin/release "$t" | grep -q "worker: bun run worker"
          rm -rf "$t"

  test:
    name: Buildpack Tests
    runs-on: ubuntu-latest
    needs: [lint, detect-release]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends curl jq unzip

      - name: Run tests
        run: make test

  actionlint:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2

