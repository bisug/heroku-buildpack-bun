name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-quality:
    name: Shell quality (shellcheck strict + shfmt)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Strict ShellCheck (errors only, fail on findings)
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca # master
        with:
          severity: error
          check_together: 'yes'

      - name: Enforce shell formatting
        run: |
          SHFMT_RELEASE="https://github.com/mvdan/sh/releases/download/v3.9.0"
          curl --retry 5 --retry-all-errors -fsSL -o /tmp/shfmt "$SHFMT_RELEASE/shfmt_v3.9.0_linux_amd64"
          echo "$(curl --retry 5 --retry-all-errors -fsSL "$SHFMT_RELEASE/sha256sums.txt" | grep 'shfmt_v3.9.0_linux_amd64' | cut -d' ' -f1)  /tmp/shfmt" | sha256sum -c -
          chmod +x /tmp/shfmt
          /tmp/shfmt -d -i 2 -ci -bn bin/compile bin/detect bin/release bin/test lib/json.sh lib/version.sh

      - name: No leftover debug or dangerous patterns
        run: |
          if grep -RInE 'set -x|TODO|FIXME|XXX|rm -rf /|chmod 777' bin lib; then
            echo "::error::debug or dangerous pattern found"; exit 1
          fi
          if grep -RInE 'curl[^|]*\|[[:space:]]*(ba)?sh' bin lib; then
            echo "::error::curl-pipe-shell pattern found"; exit 1
          fi
